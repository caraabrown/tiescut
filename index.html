<script>
(function() {
  var tag = document.createElement('script');

  var clips = [[4,36],[40,72],[76,108],[112,132]];
  var currentClip = 0;
  var player;
  var checkInterval;
  window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player('yt-bg', {
      videoId: 'Sws0OYU_Czw',
      playerVars: {
        autoplay: 1,
        mute: 1,
        controls: 0,
        showinfo: 0,
        rel: 0,
        modestbranding: 1,
        iv_load_policy: 3,
        cc_load_policy: 0,
        disablekb: 1,
        fs: 0,
        start: clips[0][0],
        playsinline: 1
      },
      events: {
        onReady: function(e) {
          e.target.seekTo(clips[0][0]);
          e.target.playVideo();
          checkInterval = setInterval(function() {
            if (!player) return;
            var t = player.getCurrentTime();
            if (t >= clips[currentClip][1]) {
              currentClip = (currentClip + 1) % clips.length;
              player.seekTo(clips[currentClip][0], true);
            }
          }, 500);
        },
        onStateChange: function(e) {
          if (e.data === YT.PlayerState.ENDED) {
            currentClip = 0;
            player.seekTo(clips[0][0], true);
            player.playVideo();
          }
        }
      }
    });
  };
})();
